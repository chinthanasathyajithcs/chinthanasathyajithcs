name: Profile cards

on:
  schedule:
    # Off-peak minutes: GitHub drops many runs scheduled at :00 and :30.
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Render streak card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 scripts/streak.py "${{ github.repository_owner }}" dist/streak.svg

      - name: Generate contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-grid.svg?palette=github-dark&color_snake=#50BF91&color_dots=#161B22,#17392e,#1f6b52,#2f9d78,#50BF91

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
